<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sample Coffee — まちの小さな焙煎所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="hero">
    <div class="hero__bar"><span class="live"><span class="dot"></span>リアルタイム更新中</span></div>
    <div class="hero__inner">
      <p class="eyebrow">Café &amp; Roastery</p>
      <h1 class="serif">Sample Coffee</h1>
      <p class="tag">一杯ずつ、ていねいに。まちの小さな焙煎所。</p>
      <p class="meta">営業 9:00–18:00 ・ 火曜定休 ・ 東京・サンプル町</p>
    </div>
  </header>

  <!-- ▼ キャンペーンバナー（LINE更新・最新のみ） -->
  <div class="wrap" style="padding-bottom:0">
    <div data-lu-tenant="decafedecafe" data-lu-slots="campaign"></div>
  </div>

  <main class="wrap" style="padding-top:6px">
    <!-- ▼ 本日の情報（LINE更新・最新のみ） -->
    <section class="card">
      <div data-lu-tenant="decafedecafe" data-lu-slots="today"></div>
    </section>

    <!-- ▼ お知らせ（LINE更新・蓄積型。トップは最新2件＋一覧へ動線） -->
    <section class="card">
      <div data-lu-tenant="decafedecafe" data-lu-slots="notice" data-lu-limit="2"></div>
      <a class="more-link" href="./news.html" data-keep-t>お知らせをすべて見る →</a>
    </section>

    <!-- ▼ 静的な店舗情報（ここはLINE更新の対象外＝普通のサイト部分） -->
    <section class="card info">
      <p class="card-head">店舗情報 / INFO</p>
      <dl>
        <dt>営業時間</dt><dd>9:00 – 18:00（L.O. 17:30）</dd>
        <dt>定休日</dt><dd>毎週火曜日</dd>
        <dt>住所</dt><dd>東京都サンプル区サンプル町 1-2-3</dd>
        <dt>アクセス</dt><dd>サンプル駅から徒歩5分</dd>
      </dl>
    </section>

    <p class="foot">
      <span class="note"><span class="d"></span>キャンペーン・本日の情報・お知らせは、お店のLINEからリアルタイムに更新されています。</span><br>
      © Sample Coffee
    </p>
  </main>

  <script src="./demo.js"></script>
  <script src="https://line-update-demo.shota-dev.workers.dev/widget.js"></script>
</body>
</html>
