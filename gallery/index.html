<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="format-detection" content="telephone=no" />
        <title>Gallery — Shota Nogami</title>
        <meta
            name="description"
            content="デザインから実装まで手がけた制作物のギャラリー。LP・Web サイトのサンプルを実際のページとして公開しています。"
        />
        <meta property="og:title" content="Gallery — Shota Nogami" />
        <meta
            property="og:description"
            content="デザインから実装まで手がけた制作物のギャラリー。"
        />
        <meta property="og:type" content="website" />

        <!-- Fonts: トップページと同一構成（Noto Serif JP / Noto Sans JP / DM Sans / JetBrains Mono） -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        />

        <link rel="stylesheet" href="../style.css" />
        <link rel="stylesheet" href="./gallery.css" />

        <link
            rel="icon"
            type="image/svg+xml"
            href="../assets/brand/favicon.svg"
        />
    </head>
    <body>
        <!-- 紙の質感を作るグレインオーバーレイ -->
        <div class="grain" aria-hidden="true"></div>

        <header class="site-header" data-header>
            <a class="brand" href="../index.html" aria-label="Shota Nogami — home">
                <span class="brand__mark" aria-hidden="true">
                    <svg viewBox="0 0 640 420" fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="butt" stroke-linejoin="round">
                        <path d="M 224 216 C 178 204, 116 211, 72 249 C 31 285, 18 337, 46 373 C 74 409, 133 408, 186 376 C 237 345, 272 290, 306 226 L 350 142 C 386 76, 435 33, 493 29 C 540 26, 581 51, 596 88 C 614 132, 594 184, 549 220 C 504 256, 435 272, 363 253" />
                    </svg>
                </span>
                <span class="brand__name">Shota Nogami</span>
            </a>
            <nav class="nav" aria-label="primary">
                <a href="../index.html">Home</a>
                <a href="../index.html#works">Works</a>
                <a href="../index.html#contact" class="nav__cta">Contact</a>
            </nav>
        </header>

        <main id="top">
            <!-- ============== INTRO ============== -->
            <section
                class="section gallery-intro"
                aria-labelledby="gallery-title"
            >
                <p class="eyebrow" data-anim="rise">Gallery</p>
                <h1 id="gallery-title" class="h2" data-anim="rise">
                    <span class="h2__phrase">作ったものは、</span
                    ><span class="h2__phrase">触ってもらうのが早い。</span>
                </h1>
                <p class="section__lead" data-anim="rise">
                    デザインから実装まで手がけた制作物のサンプル集です。<br />
                    カードを選ぶと、実際のページがそのまま開きます。
                </p>
            </section>

            <!-- ============== GALLERY LIST ============== -->
            <!-- 作品カードは works.js のデータから gallery.js が自動生成する。
                 作品を追加するときは works.js の配列の先頭にエントリを 1 つ足すだけ -->
            <section class="section gallery-list" aria-label="制作物一覧">
                <ol class="gallery-grid"></ol>
                <noscript>
                    <p>
                        作品一覧の表示には JavaScript が必要です。
                    </p>
                </noscript>
            </section>
        </main>

        <footer class="site-footer">
            <div class="site-footer__inner">
                <p class="site-footer__name">Shota Nogami</p>
                <p class="site-footer__role">
                    Frontend-focused Full-stack Engineer / Tokyo
                </p>
                <ul class="site-footer__links">
                    <li><a href="../index.html#about">About</a></li>
                    <li><a href="../index.html#works">Works</a></li>
                    <li><a href="../index.html#tech">Skills</a></li>
                    <li><a href="./">Gallery</a></li>
                    <li><a href="../index.html#contact">Contact</a></li>
                </ul>
                <p class="site-footer__copy">© 2026 Shota Nogami</p>
            </div>
        </footer>

        <!-- 読み込み順が重要: works.js(データ) → gallery.js(カード生成) → main.js(アニメ監視) -->
        <script src="./works.js" defer></script>
        <script src="./gallery.js" defer></script>
        <script src="../main.js" defer></script>
    </body>
</html>
